[build]
builder = "RAILPACK"
buildCommand = """
SERVICE_TARGET="$(printf '%s' "${RAILWAY_DEPLOY_TARGET:-$RAILWAY_SERVICE_NAME}" | tr '[:upper:]' '[:lower:]')"
case "$SERVICE_TARGET" in
  frontend|*frontend*)
    if [ -d frontend ]; then cd frontend; fi
    npm ci
    npm run build
    ;;
  backend|*backend*)
    if [ -d backend ]; then cd backend; fi
    python -m pip install --upgrade pip
    python -m pip install --no-cache-dir -r requirements.txt
    ;;
  *)
    echo "Configure RAILWAY_DEPLOY_TARGET como 'frontend' ou 'backend'." >&2
    exit 1
    ;;
esac
"""

[deploy]
startCommand = """
SERVICE_TARGET="$(printf '%s' "${RAILWAY_DEPLOY_TARGET:-$RAILWAY_SERVICE_NAME}" | tr '[:upper:]' '[:lower:]')"
case "$SERVICE_TARGET" in
  frontend|*frontend*)
    if [ -d frontend ]; then cd frontend; fi
    npx vite preview --host 0.0.0.0 --port "${PORT:-4173}"
    ;;
  backend|*backend*)
    if [ -d backend ]; then cd backend; fi
    python -m uvicorn app.main:app --host 0.0.0.0 --port "${PORT:-8000}"
    ;;
  *)
    echo "Configure RAILWAY_DEPLOY_TARGET como 'frontend' ou 'backend'." >&2
    exit 1
    ;;
esac
"""
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
